name: smart_image_x_example
description: Demonstrates the SmartImageX package.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  smart_image_x:
    path: ../
  # Used by the File-source demo to write the bundled sample to a temp path.
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample.png
    - assets/logo.svg
    - assets/avatar_placeholder.svg
