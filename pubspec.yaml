name: smart_image_x
description: >-
  One widget that auto-detects any image source (network, asset, file, bytes,
  base64, SVG) with caching, BlurHash, zoom, galleries and transformations.
version: 1.0.2
repository: https://github.com/vickyparajapati-flutter/smart_image_package
issue_tracker: https://github.com/vickyparajapati-flutter/smart_image_package/issues
documentation: https://github.com/vickyparajapati-flutter/smart_image_package#readme
topics:
  - image
  - cache
  - svg
  - blurhash
  - widget

screenshots:
  - description: "Auto-detected image sources, each explained."
    path: screenshots/sources_light.png
  - description: "Shapes, loaders, BlurHash, effects and the fallback chain."
    path: screenshots/features_light.png
  - description: "Swipeable, zoomable, hero-animated gallery."
    path: screenshots/gallery_light.png
  - description: "Built-in compress / resize / transform utilities."
    path: screenshots/tools_light.png
  - description: "Live two-tier cache statistics."
    path: screenshots/cache_light.png

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # SVG rasterization / rendering.
  flutter_svg: ^2.3.0

  # Streamed network downloads with byte-level progress.
  http: ^1.6.0

  # Cross-platform disk-cache directory resolution.
  path_provider: ^2.1.5

  # Stable, collision-resistant cache keys.
  crypto: ^3.0.7

  # Connection-quality detection for the adaptive-quality engine.
  connectivity_plus: ^7.1.1

  # Pure-Dart codec used by the compression / transform / metadata utilities.
  # 4.9.x requires Dart >=3.11 (Flutter 3.44); 4.8.x is the latest compatible
  # with this package's >=3.4 floor.
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Used only by tests to fake the disk-cache directory without a real plugin.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
